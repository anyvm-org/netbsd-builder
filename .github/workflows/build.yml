name: "Build"

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - '*'
    paths:
      - 'build.py'
      - '.github/workflows/build.yml'
      - '*.txt'
      - 'conf/*'
      - 'hooks/*'
  pull_request:
    branches:
      - '*'
    paths:
      - 'build.py'
      - '.github/workflows/build.yml'
      - '*.txt'
      - 'conf/*'
      - 'hooks/*'
  workflow_dispatch:

  release:
    types: [ created ]


concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["9.0", "9.0-aarch64", "9.1", "9.1-aarch64", "9.2", "9.2-aarch64", "9.3", "9.3-aarch64", "9.4", "9.4-aarch64", "10.0", "10.0-aarch64", "10.0-sparc64", "10.1", "10.1-aarch64", "10.1-sparc64", "11.0", "11.0-aarch64", "11.0-riscv64", "11.0-sparc64"]
    runs-on: ubuntu-24.04
    steps:
#    - name: Free Disk Space (Ubuntu)
#      uses: jlumbroso/free-disk-space@main
#      with:
#        # this might remove tools that are actually needed,
#        # if set to "true" but frees about 6 GB
#        tool-cache: false
    - uses: actions/checkout@v6
    - name: Creating Web console
      uses: anyvm-org/cf-tunnel@v0
      id: tunnel
      with:
        protocol: http
        port: 8000
    - run: |
        python3 build.py conf/netbsd-${{ matrix.os }}.conf
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        # One artifact per matrix job, so they don't collide and each can be
        # downloaded independently from the run page.
        name: netbsd-${{ matrix.os }}
        # build.py writes all generated files (including these release
        # artifacts) under build/ to keep the repo root clean; see wf().
        path: |
          build/netbsd-${{ matrix.os }}.qcow2.zst*
          build/netbsd-${{ matrix.os }}-id_rsa.pub
          build/netbsd-${{ matrix.os }}-host.id_rsa
          build/netbsd-${{ matrix.os }}.qemu
          build/netbsd-${{ matrix.os }}.profile.json
        if-no-files-found: warn
        # qcow2.zst is already maximally compressed; gzip-recompressing the
        # bundle just burns CPU for ~0 savings.
        compression-level: 0
        # Auto-expire to keep the repo's artifact storage quota from growing
        # unboundedly. Two days is enough for a human to grab a copy for
        # local verification; anything that needs to persist longer should
        # cut a release (which goes through the Upload Release Asset step
        # below and lives forever).
        retention-days: 2
    - name: Upload Release Asset
      # Gate on the event, not github.ref: for a 'release' event github.ref is
      # NOT guaranteed to be refs/tags/<tag> -- depending on how the release/tag
      # is created it can come through as refs/heads/<target_commitish> (e.g.
      # refs/heads/main), which silently skips the upload. event_name is stable.
      if: "github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')"
      id: upload-release-asset
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # action-gh-release derives the tag from github.ref by default, but on a
        # 'release' event github.ref can be refs/heads/<branch> (not a tag), which
        # fails with "GitHub Releases requires a tag". Pass the tag explicitly:
        # release event -> github.event.release.tag_name; tag push -> github.ref_name.
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: |
          build/netbsd-${{ matrix.os }}.qcow2.zst*
          build/netbsd-${{ matrix.os }}-id_rsa.pub
          build/netbsd-${{ matrix.os }}-host.id_rsa
          build/netbsd-${{ matrix.os }}.qemu
          build/netbsd-${{ matrix.os }}.profile.json










  # Publish the sparc64 hybrid-layout BOOT DISKS as release assets:
  # <os>-<release>-sparc64-boot.qcow2.zst, one per 10.x sparc64 release.
  # These are the small IDE disks (sun label + FFS + bootblock + ofwboot +
  # the ANYVM "root on sd0a" kernel) that the runtime boots from while the
  # main qcow2 asset -- the actual system -- lives on an mptsas1068 SCSI
  # disk, bypassing QEMU sun4u's wedge-prone CMD646 IDE. Everything is
  # assembled from the official NetBSD release sources/sets by
  # files/build-sparc64-bootdisk.sh (the same script the image build's
  # hooks/host_beforeBuild.sh runs, so what ships here is exactly what the
  # image build verified); no prebuilt binaries live in git.
  # A single job, NOT part of the build matrix: every matrix job uploading
  # the same asset name in parallel would race (GitHub rejects duplicate
  # asset names), and the upload should not depend on any one image build
  # succeeding. Injected via UPLOAD_FILES_JOB in .github/data/datafile.ini.
  release-files:
    # Gate on the event, not github.ref: a 'release' event's github.ref can be
    # refs/heads/<branch>, which silently skips the upload. event_name is stable.
    if: "github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Build the sparc64 boot disks
      run: |
        bash files/build-sparc64-bootdisk.sh 10.0 build
        bash files/build-sparc64-bootdisk.sh 10.1 build
    - name: Build the patched sparc64 QEMU
      # PATCH-pinned, not version-pinned: every upstream QEMU has the sun4u
      # sabre IRQ-clobber bug (files/qemu-sabre-irq-clobber.patch); anyvm
      # prefers this build for sparc64 guests on Linux x86_64 hosts. Built
      # here from upstream sources -- self-contained, no other builder's
      # assets involved.
      run: bash files/build-qemu-sparc64.sh build
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # Pass the tag explicitly: action-gh-release derives it from github.ref
        # by default, but on a 'release' event that can be a branch ref, failing
        # with "GitHub Releases requires a tag".
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: |
          build/netbsd-10.0-sparc64-boot.qcow2.zst
          build/netbsd-10.1-sparc64-boot.qcow2.zst
          build/qemu-10.2.3-sparc64-noble.tar.zst








