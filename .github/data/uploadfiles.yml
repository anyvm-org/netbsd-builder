  # Publish the extra runtime files netbsd guests need, as release assets
  # beside the VM images, so downstream consumers (anyvm's runtime, end
  # users) fetch them from THIS builder's release at a pinned version:
  #   * qemu-10.2.3-sparc64-noble.tar.zst -- the PATCHED qemu-system-sparc64.
  #     Every upstream QEMU carries the sun4u sabre IRQ-clobber bug
  #     (files/qemu-sabre-irq-clobber.patch); anyvm downloads this patched
  #     build for sparc64 guests on Linux x86_64 hosts so the cmd646 "lost
  #     interrupt" wedge never happens at run time. Assembled from upstream
  #     sources by files/build-qemu-sparc64.sh -- the same script the image
  #     build's hooks/host_beforeBuild.sh runs, so what ships here is exactly
  #     what the images are built and verified on; no prebuilt binaries live
  #     in git, and no sibling builder's assets are referenced.
  #   * netbsd-11.0-microvm-kernel -- NetBSD's official MICROVM kernel
  #     (release binary/kernel/netbsd-MICROVM.gz, SHA512-verified,
  #     gunzipped), which the 11.0-microvm variant boots by direct kernel
  #     load (profile.json "kernel_asset"). Fetched by
  #     files/fetch-microvm-kernel.sh.
  # A single job, NOT part of the build matrix: every matrix job uploading
  # the same asset name in parallel would race (GitHub rejects duplicate
  # asset names), and the upload should not depend on any one image build
  # succeeding. Injected via UPLOAD_FILES_JOB in .github/data/datafile.ini.
  release-files:
    # Gate on the event, not github.ref: a 'release' event's github.ref can be
    # refs/heads/<branch>, which silently skips the upload. event_name is stable.
    if: "github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Build the patched sparc64 QEMU
      run: bash files/build-qemu-sparc64.sh build
    - name: Fetch the MICROVM kernels
      run: bash files/fetch-microvm-kernel.sh build
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # Pass the tag explicitly: action-gh-release derives it from github.ref
        # by default, but on a 'release' event that can be a branch ref, failing
        # with "GitHub Releases requires a tag".
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: |
          build/qemu-10.2.3-sparc64-noble.tar.zst
          build/netbsd-11.0-microvm-kernel
