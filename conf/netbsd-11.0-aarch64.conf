
VM_RELEASE=11.0

# 11.0 aarch64 installs from the evbarm-aarch64 ISO via sysinst, NOT the
# prebuilt gzimg. The 11.0 arm64.img.gz reboot-loops under QEMU: its first-boot
# resize_root grows the root FFS and reboots on every boot, and the 11.0
# GENERIC64 kernel moves the console to the virtio-gpu framebuffer so the
# serial console-build can never log in. A fresh ISO install sidesteps both.
# aarch64 has no base32/debug32 sets, so there is no missing-set prompt and the
# standard ISO (no DVD published for aarch64) carries every default set.
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/images/11.0/NetBSD-11.0-evbarm-aarch64.iso"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/$VM_RELEASE/All/)\" /usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

# The fresh install sets the hostname to anyvm.org, so the getty banner is
# "NetBSD/evbarm (anyvm.org) (constty)". OCR on the virtio-gpu framebuffer
# misreads the "(" before constty as "C" ("...org) Cconstty)"), so anchor on
# the host-independent, paren-free tail "constty)".
VM_LOGIN_TAG="constty)"

VM_OPTS="conf/netbsd-11.0-aarch64.opts.txt"




# VNC-build (default): the 11.0 GENERIC64 kernel puts the console on the
# virtio-gpu framebuffer, so build.py drives sysinst over VNC + OCR, not the
# serial console. (Do NOT set VM_USE_CONSOLE_BUILD / VM_NO_VNC_BUILD here.)
VM_ARCH=aarch64





VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
