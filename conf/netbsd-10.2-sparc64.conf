
VM_RELEASE=10.2

# 10.1 sparc64 installs from the full install ISO via sysinst over the SERIAL
# console. Unlike 11.0, the 10.x release does NOT ship a separate "-dvd" image;
# the plain NetBSD-10.1-sparc64.iso (~459 MB) already bundles every set, so the
# answer file installs straight from CD and never hits a missing-set prompt.
# build.py boots it on qemu-system-sparc64 "sun4u" (UltraSPARC IIi + OpenBIOS):
# IDE disk -> wd0, CD -> cd0, the chosen NIC on pciB, console on com0 (see the
# sparc64 branch in build.py for the -vga none / pciB / memory details).
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-10.2/images/NetBSD-10.2-sparc64.iso"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225

# sun4u + OpenBIOS: the sparc64 kernel's early OpenFirmware pmap bootstrap
# panics ("Can't claim two pages of memory" -> Unhandled Exception 0x30) when
# the guest has more than ~2 GB of RAM. 2048 MB boots cleanly. The default
# VM_MEMORY=6144 would make every boot panic, so pin it here.
VM_MEMORY=2048
# QEMU sun4u is uniprocessor (1 x UltraSPARC-IIi); build with a single CPU.
VM_CPU=1
# The sparc64 OpenFirmware FCode bootblock mis-reads ofwboot from a large root
# FFS and hangs with "Inode not directory" (NetBSD PR 56363) -- the root must
# stay small (well under ~4 GB). The default 200G disk is unbootable on sparc64,
# so build on a 4G disk (root ends up ~1.9G, which boots). anyvm.py never
# resizes the image, so this 4G disk is what the runtime VM gets.
VM_DISK_SIZE=4G

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Concurrent net+disk DMA during the build (pkg_add) drives QEMU's sun4u CMD646
# IDE into a sustained "lost interrupt" state, so the final `shutdown -p` sync
# crawls (each disk command times out ~10s). Give the poweroff wait plenty of
# headroom to reach "has halted" CLEANLY -- a premature force-kill mid-sync can
# corrupt the root FFS and drop the verify VM to single-user. ~1200s is enough
# for the slow sync to drain. (The other arches keep the 1800s default.)
VM_SHUTDOWN_MAX_SECONDS=1200
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into
# VM_PKG_PATH, so the guest never needs to follow a redirect (older pkg_add /
# ftp(8) can't).
#
# A BRAND-NEW release has no pkgsrc directory at all, so there is no redirect
# to resolve and this bakes a dead URL: sparc64/10.2/All/ answers a plain 404
# (checked 2026-09-17) and every pkg_add against it fails. So probe the
# resolved URL and, when it is not 200, fall back to a quarterly built for
# the branch's BASE release -- upstream's own rule rather than an inference,
# since sparc64/10.1/All/ is itself a 302 to a 10.0_* quarterly. Scrape the
# directory listing, never an alias: the sparc64 aliases lag badly (10.1/
# still points at 10.0_2024Q3).
#
# Walk the candidates NEWEST FIRST and take the first that actually carries
# the packages this image installs, because NEWEST IS NOT BEST -- a bulk
# build can be partial. sparc64's 10.0_2026Q1 has 15176 packages but no
# rsync, fuse-sshfs or tree, while the OLDER 10.0_2024Q3 is complete at
# 25056 (counted 2026-09-17). Probing for rsync (this conf's VM_RSYNC_PKG,
# set below) is the requirement itself, not a heuristic; unlike the runtime
# PKG_PATH in hooks/vm_postBuild.sh, which may list several directories and
# let pkg_add walk them, this has to resolve to ONE base URL because
# conf/netbsd-sparc64-pkgfetch.sh fetches "$ANYVM_PKG_PATH/pkg_summary.gz"
# directly. Leaving VM_PKG_PATH empty when nothing matches fails the build
# loudly instead of baking a URL with no packages behind it.
_pkgsrc_sparc64=http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/sparc64
VM_PKG_PATH="$(curl -sL --max-time 60 -o /dev/null -w '%{url_effective}' "$_pkgsrc_sparc64/$VM_RELEASE/All/")"
if [ "$(curl -sL --max-time 60 -o /dev/null -w '%{http_code}' "$VM_PKG_PATH")" != "200" ]; then
  VM_PKG_PATH=
  for _pkgsrc_q in $(curl -sL --max-time 60 "$_pkgsrc_sparc64/" \
      | grep -oE "${VM_RELEASE%%.*}\.0_[0-9][0-9][0-9][0-9]Q[0-9]" \
      | sort -ru); do
    if curl -sL --max-time 120 "$_pkgsrc_sparc64/$_pkgsrc_q/All/" \
        | grep -q '"rsync-[0-9]'; then
      VM_PKG_PATH="$_pkgsrc_sparc64/$_pkgsrc_q/All/"
      break
    fi
  done
fi
VM_INSTALL_CMD="PKG_PATH=\"$VM_PKG_PATH\" /usr/sbin/pkg_add"
# Two-phase install (download the dependency closure to a tmpfs first, then
# pkg_add from RAM): plain pkg_add does net+disk DMA concurrently, which
# wedges QEMU sun4u's CMD646 into a lost-interrupt state and makes the final
# shutdown sync crawl for hours. See the script for details.
VM_INSTALL_SCRIPT="conf/netbsd-sparc64-pkgfetch.sh"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

# NIC model. The onboard sunhme (hme0) and e1000 (wm0) both work; build.py puts
# the chosen one on the empty pciB bus. We use e1000 because it keeps the cold
# boot + enablessh phase free of "cmdide0: lost interrupt" noise (sunhme starts
# losing cmd646 interrupts as soon as the network comes up). NOTE: e1000 does
# NOT fully cure the slow shutdown -- once pkg_add does concurrent net+disk DMA,
# the cmd646 still enters the lost-interrupt state and the final sync crawls
# (handled by VM_SHUTDOWN_MAX_SECONDS above).
VM_NIC=e1000

# Serial console getty: anchor on the universal "login:" prompt.
VM_LOGIN_TAG="login:"

# Shared with 10.0 sparc64 (same sysinst flow), mirroring how the amd64 10.0/10.1
# confs share netbsd-10.0.opts.txt.
VM_OPTS="conf/netbsd-10.0-sparc64.opts.txt"

# Serial console build: OpenBIOS + the sparc64 kernel log to com0 (the -serial
# chardev), and there is no usable framebuffer (the sun4u VGA only works in the
# firmware). sysinst is driven over the serial log, not VNC/OCR.
VM_ARCH=sparc64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# Single IDE disk (wd0), like 11.0. The cmd646 "lost interrupt" wedge that
# once forced a hybrid mpt-disk layout is fixed at its source now: the sun4u
# sabre IRQ-clobber patch (files/qemu-sabre-irq-clobber.patch) is applied to
# the QEMU this build runs on (VM_QEMU_TAR below) and to the QEMU anyvm runs
# at run time on Linux x86_64 hosts (netbsd-builder release asset). rsync is
# included: its old "not stable" verdict was that wedge in disguise, and the
# full sync matrix incl. rsync is CI-green (anyvm netbsd.yml testsparc64).
# scp stays first / default (anyvm.py also defaults netbsd/sparc64 to scp).
# CAVEAT: macOS/Windows hosts can't run the x86_64 patched QEMU tarball, so
# on those hosts the single-disk image runs on stock QEMU and can wedge under
# heavy concurrent I/O -- same limitation as 11.0.
VM_SYNC_METHODS="scp,sshfs,nfs,rsync,tar"

# Build on the PATCHED qemu-system-sparc64, not the runner's stock QEMU 8.2:
# stock has the sun4u sabre IRQ-clobber bug that wedges cmd646 + e1000 under
# concurrent DMA, so install / first-boot randomly failed the build. The
# patched build (files/build-qemu-sparc64.sh applies files/qemu-sabre-irq-
# clobber.patch) is compiled by hooks/host_beforeBuild.sh; setup() extracts
# VM_QEMU_TAR and the whole build runs on it, wedge-free.
VM_QEMU_TAR="build/qemu-10.2.3-sparc64-noble.tar.zst"
VM_QEMU_BIN="qemu10-sparc64/bin/qemu-system-sparc64"
