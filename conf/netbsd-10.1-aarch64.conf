
VM_RELEASE=10.1

VM_VHD_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-10.1/evbarm-aarch64/binary/gzimg/arm64.img.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/$VM_RELEASE/All/)\" /usr/sbin/pkg_add"


VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG="NetBSD/evbarm (arm64) (constty)"

# This image's first boot straddles build.py's 300 s default, so the login wait
# must be widened or the build fails at random. Measured first-boot login waits
# across four CI runs: 231 s and 261 s (both green) vs 420 s and one that blew
# past 300 s (both red) -- the spread brackets the default, which is exactly
# why it failed intermittently. Run 30206731232 was killed one line short of
# the prompt: the serial had already printed "Starting sshd." in the same
# second the timeout fired. The variance is not CPU-model related (231 s was
# on max, 261 s on cortex-a72), it is just a slow evbarm boot under TCG.
VM_LOGIN_MAX_SECONDS=900




VM_ARCH=aarch64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# Pin -cpu cortex-a72 instead of the aarch64 default -cpu max. On max this
# build's guest sshd accepts a connection and then dies mid-handshake --
# "kex_exchange_identification: read: Connection reset by peer / Connection
# reset by 127.0.0.1 port 2225" on every probe until the ssh wait gives up
# (run 30205578490). That is the same sshd-corruption signature 9.x aarch64
# shows on max, and cortex-a72 (ARMv8.0, no VHE/SVE) is the same cure: the
# 10.1-aarch64 job passed cleanly with this pin in run 30199351351.
#
# The pin is per-release on purpose -- do NOT copy it to
# netbsd-10.0-aarch64.conf. 10.0 breaks the OTHER way round: with cortex-a72
# its guest sshd refuses to start at all ("/etc/rc.d/sshd exited with code 1",
# run 30199351351) after ten consecutive green runs on max. So 10.0 -> max,
# 10.1 -> cortex-a72, and neither value is safe to generalise across 10.x.
VM_CPU_MODEL="cortex-a72"





VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
