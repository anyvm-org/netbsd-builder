
VM_RELEASE=10.1

VM_VHD_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-10.1/evbarm-aarch64/binary/gzimg/arm64.img.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/$VM_RELEASE/All/)\" /usr/sbin/pkg_add"


VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG="NetBSD/evbarm (arm64) (constty)"




VM_ARCH=aarch64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# Pin -cpu cortex-a72 instead of the aarch64 default -cpu max. Under QEMU TCG,
# 10.x aarch64 on max boots all the way through rc (dhcpcd, sshd and postfix
# all start) yet never becomes ssh-reachable: ntpd logs "Temporary failure in
# name resolution" and every ssh probe returns rc=255 until the boot window
# expires. Seen 2026-07-26 in vmactions/netbsd-vm run 30192493503, where all
# three 10.1-aarch64 jobs failed that way (2x600s each) while every other
# release passed; a plain re-run went green, so it is a random flake of the
# max+TCG path. cortex-a72 (ARMv8.0, no VHE/SVE) is the model 9.x already pins
# for its own max-related breakage. NOTE: anyvm.py does NOT read cpu_model from
# the profile, so the runtime carries its own netbsd 9.x/10.x -> cortex-a72
# branch; this pin only governs the build (and its verification boot).
VM_CPU_MODEL="cortex-a72"





VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
