
VM_RELEASE=9.0

# Re-hosted on anyvm-org/netbsd-archive: archive.netbsd.org rate-limits CI/cloud
# IPs (HTTP 402 after ~9 MiB) so GitHub Actions cannot fetch the upstream gzimg.
# Original (unmodified): archive.netbsd.org/pub/NetBSD-archive/NetBSD-9.0/evbarm-aarch64/binary/gzimg/arm64.img.gz
VM_VHD_LINK="https://github.com/anyvm-org/netbsd-archive/releases/download/v0.0.1/NetBSD-9.0-evbarm-aarch64-arm64.img.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
# All 9.x aarch64 paths redirect to the single aarch64/9.0_2026Q1/All/ quarterly.
# Preemptive (mirrors the x86_64 9.x fix of 2026-07-21): the x86_64/9.0_2026Q2
# bulk build dropped fuse-sshfs, so when the aarch64 redirect rolls past
# 9.0_2026Q1 it will likely lose it too. PKG_PATH is a semicolon-separated
# search list (NetBSD 9.0 pkg_install.conf(5)), so append the known-good
# aarch64/9.0_2026Q1 quarterly as a fallback consulted only for packages the
# primary lacks -- a no-op today while the redirect still points at 2026Q1.
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/$VM_RELEASE/All/);http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/9.0_2026Q1/All\" /usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG="NetBSD/evbarm (arm64) (constty)"

# Widen the login wait: build.py's 300 s default leaves this image almost no
# margin. Measured first-boot login waits for the 9.x aarch64 group are
# 258-282 s, i.e. 18-42 s of headroom, and the sibling 10.1-aarch64 image --
# same evbarm gzimg, same TCG path, measured 231/261/288 s -- blew past 300 s
# three runs in a row before it was given this override. A slightly slower
# runner is all it takes, and the failure is expensive: two 300 s attempts,
# then the build aborts. 900 s costs nothing on a healthy boot (the wait ends
# the moment the prompt appears) and removes the cliff.
VM_LOGIN_MAX_SECONDS=900




VM_ARCH=aarch64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# NetBSD 9.x aarch64 MUST run under -cpu cortex-a72, not the aarch64 default
# -cpu max. Under QEMU TCG, -cpu max corrupts the 9.x userland: sshd completes
# one connection (full kex+auth) and then the listener crashes (exits with a
# non-deterministic code, no log), so the very first post-install ssh works but
# every later connection gets "Connection closed before banner" -- the build
# hangs forever in "ssh is not ready". cortex-a72 makes sshd survive unlimited
# connections (verified on 9.4: internal self-ssh + external forward, both stable).
# 10.x/11.0 aarch64 are unaffected by max (newer userland), so this is 9.x-only.
# Recorded into the profile so anyvm.py uses cortex-a72 at runtime too (TCG).
VM_CPU_MODEL="cortex-a72"




VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
