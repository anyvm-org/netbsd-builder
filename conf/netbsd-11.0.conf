
VM_RELEASE=11.0

# Use the full DVD image, not the standard install ISO. NetBSD 11.0 selects the
# 32-bit compat set "base32" by default, but the 660 MiB install ISO
# (NetBSD-11.0_RC4-amd64.iso) does not ship base32 (nor debug/debug32/xdebug),
# so sysinst would error "Release set base32 does not exist" mid-install. The
# 1.55 GiB DVD image bundles every set, so the install just works with the same
# answer file 10.x uses -- no fragile in-installer skip dance required.
VM_ISO_LINK="https://cdn.netbsd.org/pub/NetBSD/NetBSD-11.0_RC4/images/NetBSD-11.0_RC4-amd64-dvd.iso"
VM_OS_NAME="netbsd"
VM_OS_TYPE="netbsd9.0"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# 11.0 is still a release candidate, so `uname -r` reports "11.0_RC4" and a
# bare pkg_add derives a default PKG_PATH of .../amd64/11.0_RC4/All/ which does
# not exist (pkgsrc only publishes the .../amd64/11.0/All/ tree). Pin PKG_PATH
# to the released 11.0 packages so the pre-install set resolves; the 11.0 ABI
# matches the RC so the packages install cleanly.
VM_INSTALL_CMD="PKG_PATH=\"http://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/amd64/11.0/All/\" /usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

#VM_LOGIN_TAG="NetBSD/amd64 (anyvm.org) (constty)"
VM_LOGIN_TAG=".org) (constty)"

VM_OPTS="conf/netbsd-10.0.opts.txt"


