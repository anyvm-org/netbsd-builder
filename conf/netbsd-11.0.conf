
VM_RELEASE=11.0

# Use the full DVD image, not the standard install ISO. NetBSD 11.0 selects the
# 32-bit compat set "base32" by default, but the 660 MiB install ISO
# (NetBSD-11.0-amd64.iso) does not ship base32 (nor debug/debug32/xdebug),
# so sysinst would error "Release set base32 does not exist" mid-install. The
# 1.55 GiB DVD image bundles every set, so the install just works with the same
# answer file 10.x uses -- no fragile in-installer skip dance required.
# (Was pinned to the 11.0_RC7 media until the final NetBSD-11.0/ directory
# appeared on 2026-08; same layout, RC suffix gone.)
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.0/images/NetBSD-11.0-amd64-dvd.iso"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Build-time installs run BARE pkg_add on purpose: PKG_PATH comes from
# /etc/pkg_install.conf, which hooks/vm_postBuild.sh bakes (newest existing
# quarterly scraped from the arch listing first, rolling alias second,
# 9.0_2026Q1 pin third) right before this install step runs. Going through
# the same baked file the shipped image uses means a bad bake FAILS THE
# BUILD instead of surfacing weeks later at runtime, which is exactly how
# the dead riscv64 alias slipped through (netbsd-vm run 30790664175).
VM_INSTALL_CMD="/usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

#VM_LOGIN_TAG="NetBSD/amd64 (netbsd) (constty)"
VM_LOGIN_TAG=") (constty)"

VM_OPTS="conf/netbsd-10.0.opts.txt"



VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
