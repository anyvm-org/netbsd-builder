
VM_RELEASE=10.0

VM_VHD_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-10.0/evbarm-aarch64/binary/gzimg/arm64.img.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/$VM_RELEASE/All/)\" /usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG="NetBSD/evbarm (arm64) (constty)"




VM_ARCH=aarch64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# Pin -cpu cortex-a72 instead of the aarch64 default -cpu max, matching
# netbsd-10.1-aarch64.conf: the 10.x aarch64 image on max+TCG can boot through
# rc and still never become ssh-reachable (see the 10.1 conf for the observed
# failure). The flake was seen on 10.1, but 10.0 is the same evbarm gzimg on
# the same path, so pin it too rather than wait for it to bite. cortex-a72
# (ARMv8.0, no VHE/SVE) is the model 9.x already pins. NOTE: anyvm.py does NOT
# read cpu_model from the profile, so the runtime carries its own netbsd
# 9.x/10.x -> cortex-a72 branch; this pin only governs the build.
VM_CPU_MODEL="cortex-a72"





VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
