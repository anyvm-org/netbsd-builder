
VM_RELEASE=10.0

VM_VHD_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-10.0/evbarm-aarch64/binary/gzimg/arm64.img.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/$VM_RELEASE/All/)\" /usr/sbin/pkg_add"

# rsync is currently UNAVAILABLE in the aarch64 pkgsrc quarterly: net/rsync
# built in 2025Q4 (rsync-3.4.1) but REGRESSED OUT of 2026Q1 (the repo the
# aarch64/$VM_RELEASE path now 302-redirects to), so pkg_add fails "no pkg
# found for 'rsync'" -- which (correctly) fails the now-fatal install step.
# amd64 / riscv64 / sparc64 still ship rsync. Drop it from the package list
# until a later aarch64 quarterly rebuilds it, then restore VM_RSYNC_PKG="rsync".
# (Pinning to 2025Q4 is not durable -- old quarterlies get GC'd; 2025Q3 is
# already 404.)
VM_RSYNC_PKG=""
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG="NetBSD/evbarm (arm64) (constty)"




VM_ARCH=aarch64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1





VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
