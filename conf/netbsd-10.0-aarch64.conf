
VM_RELEASE=10.0

VM_VHD_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-10.0/evbarm-aarch64/binary/gzimg/arm64.img.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/$VM_RELEASE/All/)\" /usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG="NetBSD/evbarm (arm64) (constty)"




VM_ARCH=aarch64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# Do NOT set VM_CPU_MODEL="cortex-a72" here. It was tried on 2026-07-26 (to
# mirror the 9.x aarch64 pin) and broke this build outright: the guest came up
# with "/etc/rc.d/sshd exited with code 1", sshd never listened, and the build
# hung in the ssh wait until it was cancelled (run 30199351351) -- after ten
# consecutive green runs on the aarch64 default -cpu max.
#
# Note the asymmetry: netbsd-10.1-aarch64.conf DOES pin cortex-a72, because
# 10.1 fails on max with the opposite symptom (sshd accepts, then resets the
# connection mid-handshake). The right CPU model differs per release inside
# 10.x -- 10.0 -> max, 10.1 -> cortex-a72 -- so never copy either value across.





VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
