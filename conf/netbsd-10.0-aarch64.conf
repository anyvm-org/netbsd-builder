
VM_RELEASE=10.0

VM_VHD_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-10.0/evbarm-aarch64/binary/gzimg/arm64.img.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Build-time installs run BARE pkg_add on purpose: PKG_PATH comes from
# /etc/pkg_install.conf, which hooks/vm_postBuild.sh bakes (newest existing
# quarterly scraped from the arch listing first, rolling alias second,
# 9.0_2026Q1 pin third) right before this install step runs. Going through
# the same baked file the shipped image uses means a bad bake FAILS THE
# BUILD instead of surfacing weeks later at runtime, which is exactly how
# the dead riscv64 alias slipped through (netbsd-vm run 30790664175).
VM_INSTALL_CMD="/usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG="NetBSD/evbarm (arm64) (constty)"

# The gzimg first boot (growfs + ssh host key generation under TCG) can
# outrun the default 300 s login wait on a slow runner: run 30795787295
# (all 3 attempts) timed out at qemu-start + ~303 s, right after ssh-keygen
# had printed the new host keys but before they were synced to disk. The
# forced restart then left the key files present but TRUNCATED, so every
# later boot skipped regeneration ("file exists") and sshd died with "no
# hostkeys available" -- the reroll can never recover from that, making the
# timeout deterministic-fatal, not a flake. Same class and same fix as
# netbsd-11.0-riscv64.conf (measured first boots there: 316-474 s).
VM_LOGIN_MAX_SECONDS=900




VM_ARCH=aarch64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# Do NOT set VM_CPU_MODEL="cortex-a72" here. It was tried on 2026-07-26 (to
# mirror the 9.x aarch64 pin) and broke this build outright: the guest came up
# with "/etc/rc.d/sshd exited with code 1", sshd never listened, and the build
# hung in the ssh wait until it was cancelled (run 30199351351) -- after ten
# consecutive green runs on the aarch64 default -cpu max.
#
# Note the asymmetry: netbsd-10.1-aarch64.conf DOES pin cortex-a72, because
# 10.1 fails on max with the opposite symptom (sshd accepts, then resets the
# connection mid-handshake). The right CPU model differs per release inside
# 10.x -- 10.0 -> max, 10.1 -> cortex-a72 -- so never copy either value across.





VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
