
VM_RELEASE=11.0

# 11.0 sparc64 installs from the DVD ISO via sysinst over the SERIAL console.
# There is no prebuilt gzimg for sparc64. The standard install ISO would also
# work, but the DVD bundles every set so the answer file never hits a missing-
# set prompt (same reasoning as the amd64 conf). build.py boots it on
# qemu-system-sparc64 "sun4u" (UltraSPARC IIi + OpenBIOS): IDE disk -> wd0,
# DVD -> cd0, Happy Meal -> hme0, console on com0 (see the sparc64 branch in
# build.py for the -vga none / pciB / memory details).
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.0/images/NetBSD-11.0-sparc64-dvd.iso"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225

# sun4u + OpenBIOS: the sparc64 kernel's early OpenFirmware pmap bootstrap
# panics ("Can't claim two pages of memory" -> Unhandled Exception 0x30) when
# the guest has more than ~2 GB of RAM. 2048 MB boots cleanly (verified). The
# default VM_MEMORY=6144 would make every boot panic, so pin it here.
VM_MEMORY=2048
# QEMU sun4u is uniprocessor (1 x UltraSPARC-IIi); the default -smp 2 has no
# effect / can confuse the firmware, so build with a single CPU.
VM_CPU=1
# The sparc64 OpenFirmware FCode bootblock mis-reads ofwboot from a large root
# FFS and hangs with "Inode not directory" (NetBSD PR 56363) -- the root must
# stay small (well under ~4 GB). The default 200G disk is unbootable on sparc64,
# so build on a 4G disk (root ends up ~3.5G, which boots). anyvm.py never
# resizes the image, so this 4G disk is what the runtime VM gets.
VM_DISK_SIZE=4G

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Concurrent net+disk DMA during the build (pkg_add) drives QEMU's sun4u CMD646
# IDE into a sustained "lost interrupt" state, so the final `shutdown -p` sync
# crawls (each disk command times out ~10s). Give the poweroff wait plenty of
# headroom to reach "has halted" CLEANLY -- a premature force-kill mid-sync can
# corrupt the root FFS and drop the verify VM to single-user. ~1200s is enough
# for the slow sync to drain. (The other arches keep the 1800s default.)
VM_SHUTDOWN_MAX_SECONDS=1200

# No rsync on 11.0 sparc64: the only available binary is built for 10.x and
# hard-fails to install on the 11.0 base ("missing required library:
# /usr/lib/libcrypto.so.15" -- 11.0 ships a newer OpenSSL), which rightly
# fails the now-fatal install step. (The other 10.x packages install on 11.0
# with only a platform warning.) The trigger to restore VM_RSYNC_PKG="rsync"
# is a native sparc64/11.0 rsync BINARY, not merely the directory: as of
# 2026-07-25 sparc64/11.0/ exists (it redirects to 11.0_2026Q2/) but that
# bulk build is only ~2% done -- 560 packages vs 25056 in each 10.x set, all
# toolchain, with no rsync, fuse-sshfs or tree. Re-check with:
#   curl -sL http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/sparc64/11.0/All/ \
#     | sed -n 's/.*href="\(rsync[^"]*\.tgz\)".*/\1/p'
# 2026-09-26: that trigger has fired -- 11.0_2026Q2 now carries 5145
# packages including rsync-3.4.4 -- but still no tree or fuse-sshfs, and
# pkgfetch takes ONE base URL, so restoring rsync also needs pkgfetch to
# read a second directory. Not done yet.
VM_RSYNC_PKG=""
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_SSHFS_PKG"

# So this image installs 10.0 packages. Resolve ONE package directory on the
# HOST: the newest 10.0_* quarterly that carries every package in
# VM_PRE_INSTALL_PKGS, ftp.netbsd.org first and ftp.allbsd.org second. The
# sparc64/10.1/ alias used to be enough, but since upstream deleted the
# complete 10.0_2024Q3 (2026-09) it leads to the partial 10.0_2026Q1, which
# has no rsync, fuse-sshfs or tree. Same resolution as
# netbsd-10.2-sparc64.conf -- see the comment there.
VM_PKG_PATH=
_pkgsrc_re=$(printf '%s' "$VM_PRE_INSTALL_PKGS" | tr -s ' ' '|')
for _pkgsrc_base in http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/sparc64 \
    https://ftp.allbsd.org/pub/pkgsrc/packages/NetBSD/sparc64; do
  for _pkgsrc_q in $(curl -sL --retry 3 --max-time 60 "$_pkgsrc_base/" \
      | grep -oE "10\.0_[0-9][0-9][0-9][0-9]Q[0-9]" \
      | sort -ru); do
    # Keep only the wanted hrefs, never the whole listing (see 10.2's conf).
    _pkgsrc_hits=$(curl -sL --retry 3 --max-time 120 "$_pkgsrc_base/$_pkgsrc_q/All/" \
        | grep -oE "\"($_pkgsrc_re)-[0-9]")
    _pkgsrc_miss=
    for _pkgsrc_p in $VM_PRE_INSTALL_PKGS; do
      printf '%s\n' "$_pkgsrc_hits" | grep -q "^\"$_pkgsrc_p-[0-9]" || _pkgsrc_miss=1
    done
    if [ -z "$_pkgsrc_miss" ]; then
      VM_PKG_PATH="$_pkgsrc_base/$_pkgsrc_q/All/"
      break 2
    fi
  done
done
VM_INSTALL_CMD="PKG_PATH=\"$VM_PKG_PATH\" /usr/sbin/pkg_add"
# Two-phase install (download the dependency closure to a tmpfs first, then
# pkg_add from RAM): plain pkg_add does net+disk DMA concurrently, which
# wedges QEMU sun4u's CMD646 into a lost-interrupt state and makes the final
# shutdown sync crawl for hours. See the script for details.
VM_INSTALL_SCRIPT="conf/netbsd-sparc64-pkgfetch.sh"

VM_OCR="py"

# NIC model. The onboard sunhme (hme0) and e1000 (wm0) both work; build.py puts
# the chosen one on the empty pciB bus. We use e1000 because it keeps the cold
# boot + enablessh phase free of "cmdide0: lost interrupt" noise (sunhme starts
# losing cmd646 interrupts as soon as the network comes up). NOTE: e1000 does
# NOT fully cure the slow shutdown -- once pkg_add does concurrent net+disk DMA,
# the cmd646 still enters the lost-interrupt state and the final sync crawls
# (handled by VM_SHUTDOWN_MAX_SECONDS above). The only way to get a fast clean
# shutdown is to drop pkg_add entirely (no net+disk concurrency); we keep the
# packages and accept the slow shutdown instead.
VM_NIC=e1000

# Serial console getty: anchor on the universal "login:" prompt. The full getty
# banner ("NetBSD/sparc64 (<host>) (console)") can be substituted once the real
# multiuser banner is observed on com0.
VM_LOGIN_TAG="login:"

VM_OPTS="conf/netbsd-11.0-sparc64.opts.txt"

# Serial console build: OpenBIOS + the sparc64 kernel log to com0 (the -serial
# chardev), and there is no usable framebuffer (the sun4u VGA only works in the
# firmware). sysinst is driven over the serial log, not VNC/OCR.
VM_ARCH=sparc64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

#remove rsync from sparc64, it's not stable.
VM_SYNC_METHODS="scp,sshfs,nfs,tar"

# Build on the PATCHED qemu-system-sparc64, not the runner's stock QEMU 8.2:
# stock has the sun4u sabre IRQ-clobber bug that wedges cmd646 + e1000 under
# concurrent DMA, so install / first-boot / the slow shutdown above were all
# the same bug and the build randomly failed. hooks/host_beforeBuild.sh
# compiles the patched build from upstream sources
# (files/build-qemu-sparc64.sh applies files/qemu-sabre-irq-clobber.patch);
# setup() extracts VM_QEMU_TAR and every VM in the pipeline runs on it, so
# 11.0 (classic single disk) builds reliably. anyvm downloads the same
# patched QEMU at run time on Linux x86_64 hosts (netbsd-builder release
# asset); other hosts fall back to stock QEMU.
VM_QEMU_TAR="build/qemu-10.2.3-sparc64-noble.tar.zst"
VM_QEMU_BIN="qemu10-sparc64/bin/qemu-system-sparc64"
