
VM_RELEASE=11.0-microvm

# Fast-boot VARIANT of netbsd-11.0: the SAME DVD install and the same
# userspace, but the published runtime shape boots NetBSD's official MICROVM
# kernel directly on QEMU's 'microvm' machine type -- no BIOS, no PCI, no
# ACPI, virtio over MMIO, PVH direct kernel load. Boot-to-ssh measured 4x
# faster than the pc machine on the same image bytes (7.4s vs 29.6s under
# KVM, 3 runs each, 2026-08-31).
#
# The BUILD still runs on the pc machine: the installer ISO needs a BIOS
# bootloader and the enablessh injection needs a VGA console. VM_MICROVM
# below changes only the published profile.json (machine_type=microvm, MMIO
# virtio, kernel sidecar); anyvm.py downloads the netbsd-11.0-microvm-kernel
# release asset (published by .github/data/uploadfiles.yml from the official
# NetBSD-11.0 binary/kernel/netbsd-MICROVM.gz) and boots it with -kernel.
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.0/images/NetBSD-11.0-amd64-dvd.iso"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225

VM_MICROVM=1
# Root is the GPT wedge dk0: sysinst partitions the disk GPT, so ld0a
# overlaps the wedge and fails "cannot mount root, error 16" (probed
# 2026-08-31). console=com puts the console on the microvm ISA serial port.
VM_MICROVM_APPEND="root=dk0 console=com rw"

# NOTE: deliberately NO VM_NIC here, so this variant's BUILD is identical to
# conf/netbsd-11.0.conf's in every respect that touches the guest. build.py
# forces the MMIO virtio NIC into the PROFILE whenever VM_MICROVM is set, so
# the runtime NIC does not have to be steered from the build side. (An earlier
# revision set VM_NIC=virtio for that purpose; the v2.2.4 image built that way
# shipped with a dirty root filesystem -- 5 fsck repairs on first boot --
# while the plain 11.0 image from the same CI run was clean, so the variant
# build is kept byte-identical to the plain one.)

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Build-time installs run BARE pkg_add on purpose: PKG_PATH comes from
# /etc/pkg_install.conf, which hooks/vm_postBuild.sh bakes right before the
# install step runs (see conf/netbsd-11.0.conf for the full story).
VM_INSTALL_CMD="/usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG=") (constty)"

VM_OPTS="conf/netbsd-10.0.opts.txt"

# No "nfs": the MICROVM kernel has no built-in NFS client and the GENERIC
# nfs.kmod refuses to load into it (modload nfs -> "Exec format error",
# probed in the running MICROVM guest 2026-08-31). puffs IS built in, so
# sshfs works; rsync/scp/tar ride plain ssh.
VM_SYNC_METHODS="rsync,scp,sshfs,tar"
