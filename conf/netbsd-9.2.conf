

VM_ISO_LINK="https://archive.netbsd.org/pub/NetBSD-archive/NetBSD-9.2/images/NetBSD-9.2-amd64.iso?key=NetBSD"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225


VM_RELEASE=9.2

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
# 2026Q2 rollover (2026-07-21): the amd64/9.x redirect now lands on
# x86_64/9.0_2026Q2, whose bulk build is missing fuse-sshfs entirely (no
# renamed "sshfs" either; the 10.x/11.0 Q2 sets still have it, so the drop is
# 9.x-base-specific) -- that failed the now-fatal install step on every 9.x
# x86_64 build. PKG_PATH is a semicolon-separated search list (NetBSD 9.0
# pkg_install.conf(5): "The entries are separated by semicolon"), so keep the
# rolling redirect as the primary and append the last-known-good 9.0_2026Q1
# quarterly as a fallback consulted only for packages the primary lacks. Drop
# the fallback once a future quarterly ships fuse-sshfs for 9.x again.
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/amd64/$VM_RELEASE/All/);http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/9.0_2026Q1/All\" /usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG="NetBSD/amd64 (localhost) (constty)"

VM_OPTS="conf/netbsd-9.0.opts.txt"





VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
