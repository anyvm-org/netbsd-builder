
VM_RELEASE=11.0

# riscv64 installs from the prebuilt gzimg (riscv64.img.gz), like the aarch64
# 10.x confs -- no sysinst. build.py boots it on qemu-system-riscv64 "virt"
# with u-boot (/usr/lib/u-boot/qemu-riscv64_smode/u-boot.bin) and virtio.
VM_VHD_LINK="https://cdn.netbsd.org/pub/NetBSD/NetBSD-11.0_RC5/riscv-riscv64/binary/gzimg/riscv64.img.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Resolve the pkgsrc un-versioned->quarterly 302 redirect on the HOST (conf is
# bash-sourced, so $(...) runs locally) and bake the direct URL into PKG_PATH,
# so the guest's pkg_add never needs to follow a redirect (older pkg_add can't).
# riscv64 packages exist only from 11.0 (riscv64/11.0 -> 11.0_2025Q4).
VM_INSTALL_CMD="PKG_PATH=\"$(curl -sL -o /dev/null -w '%{url_effective}' http://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/riscv64/$VM_RELEASE/All/)\" /usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

# Anchor on the getty "login:" prompt -- "NetBSD/riscv" alone also appears in the
# efiboot/kernel boot banners and matched prematurely (build.py typed the login
# into the kernel root-device prompt). Refine to the full getty banner once the
# real "NetBSD/riscv (<host>) (<tty>)" line is observed at multiuser.
VM_LOGIN_TAG="login:"

VM_ARCH=riscv64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
